<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One City, One Journey</title>
<script src="d3.min.js"></script>
<script src="i18n.js"></script>
<style>
:root{
  --indigo:#1F2A5C;      /* Gujarat indigo: text, headings */
  --indigo-2:#4A5482;    /* secondary text */
  --hair:#D5DBE2;        /* rules */
  --ground:#E8EDEA;      /* map ground: pale survey-sheet sage */
  --sheet:#FAFBFA;       /* panel */
  --haldi:#D99A00;       /* change vehicle */
  --kumkum:#B3263E;      /* change mode */
  --metro:#2457C5;--brts:#D2452B;--amts:#2E8B57;--walk:#8A93A6;
  --f-sans:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
  --f-cond:"Avenir Next Condensed","Avenir Next","Arial Narrow",sans-serif;
  --f-guj:"Kohinoor Gujarati","Gujarati Sangam MN","Noto Sans Gujarati",sans-serif;
  --f-hi:"Kohinoor Devanagari","Devanagari Sangam MN","Noto Sans Devanagari",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.5 var(--f-sans);color:var(--indigo);background:var(--ground);display:grid;grid-template-columns:440px 1fr;height:100vh;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--haldi);outline-offset:2px}
aside{background:var(--sheet);overflow:auto;border-right:1px solid var(--hair)}
.inner{padding:26px 26px 30px}

/* masthead: signage-style condensed title + Gujarati line */
.mast h1{font:700 40px/0.95 var(--f-cond);letter-spacing:-.01em;margin:0}
html[lang=gu] body,html[lang=gu] input,html[lang=gu] select,html[lang=gu] button{font-family:var(--f-guj),var(--f-sans)}
html[lang=hi] body,html[lang=hi] input,html[lang=hi] select,html[lang=hi] button{font-family:var(--f-hi),var(--f-sans)}
html[lang=gu] .mast h1{font:700 36px/1.15 var(--f-guj)}html[lang=hi] .mast h1{font:700 36px/1.15 var(--f-hi)}
.mast .guj[lang=en]{font-family:var(--f-cond);font-weight:600}
.lang{display:inline-flex;border:1px solid var(--hair);border-radius:20px;padding:2px;margin-bottom:16px}
.lang button{font:600 13px var(--f-sans);padding:4px 12px;border-radius:16px;background:transparent;color:var(--indigo-2)}
.lang button[aria-pressed=true]{background:var(--indigo);color:#fff}
.lang button:nth-child(2){font-family:var(--f-hi)}.lang button:nth-child(3){font-family:var(--f-guj)}
.mast .guj{font:500 19px/1.3 var(--f-guj);color:var(--indigo-2);margin:6px 0 2px}
.mast p{margin:6px 0 0;color:var(--indigo-2);font-size:13.5px;max-width:34ch}
.lines{display:flex;gap:3px;margin:18px 0 20px}.lines i{height:5px;flex:1;border-radius:3px}

/* form */
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--indigo-2);margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;font:inherit;color:var(--indigo);background:#fff}
.od{position:relative;padding-left:22px}
.od:before{content:"";position:absolute;left:6px;top:36px;bottom:36px;border-left:2px dotted var(--walk)}
.od .dot{position:absolute;left:0;width:14px;height:14px;border-radius:50%;border:3px solid var(--indigo);background:#fff}
.od .dot.a{top:33px}.od .dot.b{bottom:15px;background:var(--kumkum);border-color:var(--kumkum)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:600 15px var(--f-sans);border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
.primary{background:var(--indigo);color:#fff;width:100%}
.primary:hover{background:#2B3878}
.quiet{background:transparent;color:var(--indigo);border:1px solid var(--hair)}
.quiet:hover{border-color:var(--indigo-2)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 18px}
.presets button{font:500 13px var(--f-sans);padding:5px 10px;background:#EEF1F6;color:var(--indigo);border-radius:20px}
.presets button:hover{background:#E1E6F0}

/* options as compact rows */
#out{margin-top:22px}
.opt{border-top:1px solid var(--hair);padding:14px 2px 14px;cursor:pointer}
.opt:last-child{border-bottom:1px solid var(--hair)}
.opt .top{display:flex;align-items:baseline;gap:10px}
.opt .mins{font:700 30px/1 var(--f-cond)}
.opt .mins small{font:600 15px var(--f-sans);margin-left:2px}
.opt .name{flex:1;font-weight:600;font-size:14px}
.opt .name em{font-style:normal;font-weight:500;color:var(--indigo-2);display:block;font-size:12.5px}
.opt .price{font:700 24px/1 var(--f-cond)}
.modebar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:10px;gap:2px}
.modebar span{display:block;height:100%}
.opt.sel{background:linear-gradient(90deg,#EEF1F6,transparent 70%);margin:0 -26px;padding-left:28px;padding-right:28px;border-left:4px solid var(--indigo)}
.alts{margin-bottom:6px}
.alts-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
.pager{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--indigo-2)}
.pg{width:28px;height:28px;padding:0;border-radius:50%;border:1px solid var(--hair);background:#fff;color:var(--indigo);font:700 16px/1 var(--f-sans)}
.pg:disabled{opacity:.35;cursor:default}
.tabs{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:2px}
.tab{flex:1 0 92px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px 9px;border:1px solid var(--hair);border-radius:10px;background:#fff;color:var(--indigo);text-align:left;font-weight:500}
.tab .tn{font-size:11.5px;color:var(--indigo-2);font-weight:600}
.tab .tm{font:700 20px/1.1 var(--f-cond)}.tab .tm small{font:600 11px var(--f-sans);margin-left:1px}
.tab .tp{font-size:13px;font-weight:600}
.tab .modebar{width:100%;height:5px;margin-top:5px}
.tab.on{border:2px solid var(--indigo);background:#EEF1F6;padding:7px 9px 8px}
.tab.on .tn{color:var(--indigo)}
.rush{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:-2px 0 12px;cursor:pointer}.rush input{width:auto;margin:0;accent-color:var(--indigo)}
.delay{margin:12px 0 4px;border-radius:10px;padding:10px 12px;font-size:13.5px;background:#FFF8E6;border-left:4px solid var(--haldi)}
.delay.ok{background:#EEF6F0;border-left-color:var(--amts)}
.delay.miss{background:#FBE9EC;border-left-color:var(--kumkum)}
.delay .src{display:block;font-size:11.5px;color:var(--indigo-2);margin-top:6px}
.delay button{margin-top:8px;font:600 13px var(--f-sans);border:1px solid var(--kumkum);color:var(--kumkum);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.tab .te{font-size:11px;color:var(--kumkum);font-weight:600}
.planb{margin-top:6px;border-top:2px dashed var(--kumkum);padding-top:6px}
.car text{pointer-events:none}
.pb{left:50%;transform:translateX(-50%);bottom:16px;display:flex;align-items:center;gap:12px;width:min(520px,calc(100% - 340px));padding:8px 14px}
.pb button{width:34px;height:34px;flex:none;border-radius:50%;padding:0;background:var(--indigo);color:#fff;font:700 12px var(--f-sans)}
.pb input{flex:1;accent-color:var(--indigo);padding:0;border:0;background:none}
.pb span{font:700 18px var(--f-cond);min-width:48px;text-align:right}
@media (max-width:860px){.pb{width:calc(100% - 32px);bottom:12px}}
.flag{font-size:12px;font-weight:600;color:var(--amts)}

/* the one bold thing: itinerary drawn as a transit strip map */
.strip{margin:16px 0 4px}
.st{display:grid;grid-template-columns:48px 26px 1fr;min-height:30px}
.st .t{font:600 14px var(--f-cond);text-align:right;padding-right:8px;padding-top:1px;color:var(--indigo-2)}
.st .rail{position:relative}
.st .rail:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:6px;border-radius:3px;background:var(--c,transparent)}
.st.walk .rail:before{width:0;left:12px;border-left:3px dotted var(--walk);background:none}
.st.node .rail:before{background:none}
.st .rail .n{position:absolute;left:5px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--c,var(--indigo));z-index:1}
.st .rail .n.vehicle{border-color:var(--haldi);width:18px;height:18px;left:4px}
.st .rail .n.mode{border-color:var(--kumkum);width:20px;height:20px;left:3px;background:conic-gradient(var(--c1) 0 50%,var(--c2) 50% 100%)}
.st .x{padding:0 0 12px 6px;font-size:14px}
.st .x b{font-weight:600}
.st .x .sub{color:var(--indigo-2);font-size:12.5px}
.route{display:inline-block;font:700 14px/1 var(--f-cond);color:#fff;background:var(--c);padding:4px 7px 3px;border-radius:5px;margin-right:6px;letter-spacing:.01em}
.chg{font-size:12.5px;font-weight:600}
.chg.vehicle{color:#9A6B00}.chg.mode{color:var(--kumkum)}

/* ticket */
.ticket{margin:14px 0 6px;background:#fff;border:1px solid var(--hair);border-radius:12px;position:relative;overflow:hidden}
.ticket .head{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 10px}
.ticket .head b{font:700 30px/1 var(--f-cond)}
.ticket .head span{font-size:13px;color:var(--indigo-2)}
.ticket .perf{border-top:2px dashed var(--hair);margin:0 12px;position:relative}
.ticket .perf:before,.ticket .perf:after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--sheet);border:1px solid var(--hair)}
.ticket .perf:before{left:-21px}.ticket .perf:after{right:-21px}
.ticket table{width:100%;border-collapse:collapse;font-size:13px}
.ticket td,.ticket th{padding:6px 16px;text-align:left;vertical-align:top}
.ticket th{font-weight:600;color:var(--indigo-2);font-size:12px}
.ticket td.r,.ticket th.r{text-align:right;font-variant-numeric:tabular-nums}
.ticket .src{display:block;color:var(--indigo-2);font-size:11.5px}
.ticket h4{margin:12px 16px 2px;font-size:13.5px}
.ticket .why{margin:0 16px 4px;font-size:12.5px;color:var(--indigo-2)}
.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c)}

/* heatmap block */
.heat{margin-top:26px;padding-top:18px;border-top:1px solid var(--hair)}
.heat h3{font:700 22px/1 var(--f-cond);margin:0 0 4px}
.heat p{margin:0 0 12px;font-size:13px;color:var(--indigo-2)}
.heat table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.heat td,.heat th{padding:5px 2px;border-bottom:1px solid var(--hair);text-align:left}
.heat th{font-weight:600;color:var(--indigo-2);font-size:12px}
.heat td.r,.heat th.r{text-align:right;font-variant-numeric:tabular-nums}
.heat .bar{height:6px;border-radius:3px;background:var(--indigo)}
.note{font-size:12px;color:var(--indigo-2);margin-top:22px;line-height:1.55}
.empty{color:var(--indigo-2);font-size:14px;padding:10px 0}

/* map */
main{position:relative;min-height:0}
svg{width:100%;height:100%;display:block;background:var(--ground);cursor:crosshair}
.chip{position:absolute;background:var(--sheet);border:1px solid var(--hair);border-radius:10px;padding:8px 12px;font-size:13px}
.hint{left:16px;top:16px}
.net{left:16px;bottom:16px;font-weight:600}
.net.off{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.net i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amts);margin-right:7px}
.net.off i{background:var(--haldi)}
.legend{right:16px;bottom:16px;display:grid;grid-template-columns:auto auto;gap:5px 16px}
.legend span{display:flex;align-items:center;gap:7px}.legend b{font-weight:500}
.legend .ln{width:22px;height:5px;border-radius:3px;background:var(--c)}
.legend .wk{width:22px;border-top:3px dotted var(--walk)}
.legend .rg{width:13px;height:13px;border-radius:50%;border:3px solid var(--c);background:#fff}
.hleg{right:16px;top:16px;display:none;min-width:150px}
.hleg b{display:block;margin-bottom:6px;font-size:12.5px}
.ramp{height:10px;border-radius:5px}
.ramp-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--indigo-2);margin-top:3px}

@media (max-width:860px){
  body{grid-template-columns:1fr;grid-template-rows:auto 60vh;height:auto}
  aside{order:2;border-right:0}
  main{order:1;height:60vh}
  .inner{padding:20px 16px}
  .opt.sel{margin:0 -16px;padding-left:16px;padding-right:16px}
  .legend{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .drawn{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
</style></head>
<body>
<aside><div class="inner">
  <div class="lang" role="group" aria-label="Language"><button data-l="en">English</button><button data-l="hi">हिन्दी</button><button data-l="gu">ગુજરાતી</button></div>
  <header class="mast">
    <h1 data-i="title"></h1>
    <div class="guj" id="alt"></div>
    <p data-i="tag"></p>
  </header>
  <div class="lines" aria-hidden="true"><i style="background:var(--metro)"></i><i style="background:var(--brts)"></i><i style="background:var(--amts)"></i></div>

  <div class="presets" id="presets" aria-label="Sample trips"></div>
  <div class="od">
    <span class="dot a"></span><span class="dot b"></span>
    <div class="field"><label for="from" data-i="from"></label><input id="from" list="stoplist" data-ph="ph"></div>
    <div class="field"><label for="to" data-i="to"></label><input id="to" list="stoplist" data-ph="ph"></div>
  </div>
  <datalist id="stoplist"></datalist>
  <div class="row">
    <div class="field"><label for="time" data-i="leave"></label><input id="time" type="time" value="09:00"></div>
    <div class="field"><label for="day" data-i="day"></label><select id="day"><option value="wkdy" data-i="wkdy"></option><option value="sat" data-i="sat"></option><option value="sun" data-i="sun"></option></select></div>
  </div>
  <label class="rush"><input type="checkbox" id="rush" checked> <span data-i="rush"></span></label>
  <button id="go" class="primary" data-i="plan"></button>

  <div id="out"></div>

  <section class="heat">
    <h3 data-i="heatH"></h3>
    <p data-i="heatP"></p>
    <div class="row">
      <div class="field"><label for="hmodes" data-i="network"></label><select id="hmodes"><option value="METRO,BRTS,AMTS" data-i="all"></option><option value="METRO" data-i="metroOnly"></option><option value="BRTS" data-i="brtsOnly"></option><option value="AMTS" data-i="amtsOnly"></option><option value="BRTS,AMTS" data-i="busOnly"></option></select></div>
      <div class="field"><label for="hmetric" data-i="colourBy"></label><select id="hmetric"><option value="time" data-i="time"></option><option value="fare" data-i="fare"></option></select></div>
    </div>
    <div class="row"><button id="heat" class="quiet" data-i="showHeat"></button><button id="clearheat" class="quiet" data-i="clearHeat"></button></div>
    <div id="cmp"></div>
  </section>

  <p class="note" data-i="note"></p>
</div></aside>

<main>
  <svg id="map" role="img" aria-label="Map of Ahmedabad and Gandhinagar transit"></svg>
  <div class="chip hint" id="hint"></div>
  <div class="chip net" id="net"></div>
  <div class="chip hleg" id="hleg"></div>
  <div class="chip pb" id="pb" hidden><button id="pbPlay" aria-label="Pause">❚❚</button><input type="range" id="pbSlider" aria-label="Journey time"><span id="pbTime">00:00</span></div>
  <div class="chip legend">
    <span><i class="ln" style="--c:var(--metro)"></i><b data-i="METRO"></b></span>
    <span><i class="rg" style="--c:var(--haldi)"></i><b data-i="chgVeh"></b></span>
    <span><i class="ln" style="--c:var(--brts)"></i><b data-i="BRTS"></b></span>
    <span><i class="rg" style="--c:var(--kumkum)"></i><b data-i="chgMode"></b></span>
    <span><i class="ln" style="--c:var(--amts)"></i><b data-i="AMTS"></b></span>
    <span><i class="wk"></i><b data-i="walk"></b></span>
  </div>
</main>

<script>
const COL={METRO:'#2457C5',BRTS:'#D2452B',AMTS:'#2E8B57',WALK:'#8A93A6'};
const HALDI='#D99A00',KUMKUM='#B3263E',INDIGO='#1F2A5C';
const NAME=new Proxy({},{get:(_,k)=>T(k)});
const OPTKEY={'Fastest (any mode)':'o_fast','Metro + BRTS only':'o_mb','Bus only (no metro)':'o_bus','Metro + AMTS feeder':'o_ma'};
let curSel=0,heatOn=false,PRESETS=[],RUSH=true,SHOWB=false;
const hopsTxt=n=>n===0?T('hop0'):n===1?T('hop1'):T('hops',{n});
function delayBox(o){const e=o.expected;if(!e)return'';const h=Math.floor(o.dep/3600)%24;
  if(e.missed){const m=e.missed,fb=e.fallback;
    let x=`<div class="delay miss">${T('missed',{r:NAME[m.mode]+' '+esc(m.route),s:esc(m.at),a:fmt(m.sched),b:fmt(m.reach)})}`;
    x+=fb?` ${T('planB',{a:o.mins,m:fb.mins,l:fb.mins-o.mins,f:fb.fare.split?fb.fare.split.integrated:fb.fare.total,c:hopsTxt(fb.transfers)})}<br><button onclick="SHOWB=!SHOWB;render(curSel)">${T(SHOWB?'hideB':'showB')}</button>${SHOWB?`<div class="planb">${strip({legs:fb.legs,arr:fb.arr})}</div>`:''}`:' '+T('noB');
    return x+`<span class="src">${T('delaySrc')}</span></div>`}
  if(e.late_min>0)return `<div class="delay">${T('expNote',{h,m:e.mins,d:e.late_legs.map(l=>NAME[l.mode]+' '+esc(l.route)+' +'+l.extra_min).join(', ')})}<span class="src">${T('delaySrc')}</span></div>`;
  return `<div class="delay ok">${T('onTime',{h})}<span class="src">${T('delaySrc')}</span></div>`}
let base,proj,gRoute,gPins,gHeat,pts={from:null,to:null},clickNext='from',zoomK=1,opts=[];
const svg=d3.select('#map'),g=svg.append('g');
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.round(s/60);return String(Math.floor(s/60)%24).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byName={};

fetch('/base').then(r=>r.json()).then(b=>{base=b;draw();
  const dl=$('stoplist'),seen=new Set();
  b.stops.forEach(s=>{const k=s[0]+(s[3]==='METRO'?' (Metro)':s[3]==='BRTS'?' (BRTS)':'');if(seen.has(k))return;seen.add(k);byName[k]=[s[1],s[2]];const o=document.createElement('option');o.value=k;dl.appendChild(o)});
  const P=[['Vastral Gam (Metro)','Gujarat University'],['Thaltej Gam (Metro)','Maninagar (BRTS)'],['Sachivalaya (Metro)','Kalupur'],['Chandkheda Gam','Paldi'],['Naroda Gam','Thaltej Gam (Metro)']];
  PRESETS=P;P.forEach(([a,c])=>{if(!byName[a]||!byName[c])return;const bt=document.createElement('button');bt.dataset.a=a;bt.dataset.b=c;bt.textContent=T('pre',{a:a.replace(/ \(.*\)/,''),b:c.replace(/ \(.*\)/,'')});bt.onclick=()=>{setPt('from',byName[a],a);setPt('to',byName[c],c);plan()};$('presets').appendChild(bt)});
});

function draw(){
  const W=svg.node().clientWidth,H=svg.node().clientHeight;
  const ext={type:'MultiPoint',coordinates:base.metro.flatMap(m=>m.pts.map(p=>[p[1],p[0]]))};
  proj=d3.geoMercator().fitExtent([[40,40],[W-40,H-40]],ext);
  const line=d3.line().x(p=>proj([p[1],p[0]])[0]).y(p=>proj([p[1],p[0]])[1]);
  g.append('g').selectAll('path').data(base.roads).join('path').attr('d',line).attr('fill','none').attr('stroke','#CBD3CE').attr('stroke-width',.9);
  g.append('g').selectAll('circle').data(base.stops.filter(s=>s[3]!=='METRO')).join('circle')
    .attr('cx',s=>proj([s[2],s[1]])[0]).attr('cy',s=>proj([s[2],s[1]])[1]).attr('r',1).attr('fill',s=>s[3]==='BRTS'?'#E3A08F':'#9DC3AC');
  g.append('g').selectAll('path').data(base.metro).join('path').attr('d',m=>line(m.pts)).attr('fill','none').attr('stroke',COL.METRO).attr('stroke-width',3.5).attr('stroke-linecap','round').attr('opacity',.28);
  g.append('g').selectAll('circle').data(base.stops.filter(s=>s[3]==='METRO')).join('circle')
    .attr('cx',s=>proj([s[2],s[1]])[0]).attr('cy',s=>proj([s[2],s[1]])[1]).attr('r',2.4).attr('fill','#fff').attr('stroke',COL.METRO).attr('stroke-width',1.2).append('title').text(s=>s[0]+' metro station');
  gHeat=g.append('g');gRoute=g.append('g');gPins=g.append('g');

    setPt(clickNext,[lat,lon],`Map point ${lat.toFixed(4)}, ${lon.toFixed(4)}`);

function setPt(k,ll,label){pts[k]=ll;$(k).value=label;pins()}
function pins(){gPins.selectAll('*').remove();
  const d=[['from',INDIGO],['to',KUMKUM]].filter(([k])=>pts[k]).map(([k,c])=>{const [x,y]=proj([pts[k][1],pts[k][0]]);return {x,y,c,k}});
  const p=gPins.selectAll('.pin').data(d).join('g').attr('class','pin').attr('transform',d=>`translate(${d.x},${d.y}) scale(${1/zoomK})`);

['from','to'].forEach(k=>$(k).addEventListener('change',e=>{const v=byName[e.target.value];if(v){pts[k]=v;pins()}}));
$('go').onclick=plan;$('rush').onchange=e=>{RUSH=e.target.checked;SHOWB=false;opts.length&&render(curSel)};

function plan(){
  if(!pts.from||!pts.to){$('out').innerHTML=`<p class="empty">${T('needOD')}</p>`;return}
  SHOWB=false;$('out').innerHTML=`<p class="empty">${T('planning')}</p>`;
  fetch(`/plan?from=${pts.from}&to=${pts.to}&time=${$('time').value}&day=${$('day').value}`).then(r=>r.json()).then(o=>{opts=o;render(0,true)})}

function modebar(o){const tot=o.arr-o.dep||1;
  return '<div class="modebar" aria-hidden="true">'+o.legs.filter(L=>L.arr-L.dep>0).map(L=>`<span style="flex:${L.arr-L.dep};background:${L.kind==='walk'?'#C7CDD8':COL[L.mode]}"></span>`).join('')+'</div>'}

function strip(o){
  const rides=o.legs.filter(L=>L.kind==='ride');let h='<div class="strip">';
  o.legs.forEach((L,i)=>{
    if(L.kind==='walk'){if(L.m<30)return;
      h+=`<div class="st walk"><div class="t"></div><div class="rail"></div><div class="x"><span class="sub">${T('walkTo',{m:L.m,t:Math.max(1,Math.round(L.dur/60)),to:L.to!=='Destination'?esc(L.to):T('dest')})}</span></div></div>`;return}
    const ri=rides.indexOf(L),prev=rides[ri-1],c=COL[L.mode];
    if(prev){const mode=prev.mode!==L.mode;
      h+=`<div class="st node"><div class="t">${fmt(L.dep)}</div><div class="rail"><span class="n ${mode?'mode':'vehicle'}" style="--c1:${COL[prev.mode]};--c2:${c}"></span></div><div class="x"><b>${esc(L.frm)}</b><br><span class="chg ${mode?'mode':'vehicle'}">${mode?T('chgFrom',{a:NAME[prev.mode],b:NAME[L.mode]}):T(L.mode==='METRO'?'chgLine':'chgBus',{m:NAME[L.mode]})}</span></div></div>`;
    }else{
      h+=`<div class="st node"><div class="t">${fmt(L.dep)}</div><div class="rail" style="--c:${c}"><span class="n"></span></div><div class="x"><b>${esc(L.frm)}</b></div></div>`}
    h+=`<div class="st" style="--c:${c}"><div class="t"></div><div class="rail"></div><div class="x"><span class="route" style="--c:${c}">${NAME[L.mode]} ${esc(L.route)}</span><span class="sub">${T('towards',{h:esc(L.headsign||''),km:L.km.toFixed(1)})}</span></div></div>`;
    const next=rides[ri+1];
    if(!next||o.legs[i+1]?.kind==='walk'&&o.legs[i+1].m>=30)
      h+=`<div class="st node"><div class="t">${fmt(L.arr)}</div><div class="rail" style="--c:${c}"><span class="n"></span></div><div class="x"><b>${T('getOff',{s:esc(L.to)})}</b></div></div>`;
  });
  h+=`<div class="st node"><div class="t">${fmt(o.arr)}</div><div class="rail" style="--c:${KUMKUM}"><span class="n" style="background:${KUMKUM}"></span></div><div class="x"><b>${T('arrive')}</b></div></div></div>`;

function ticket(f){
  const price=f.split?f.split.integrated:f.total;

  <table><tr><th>${T('leg')}</th><th class="r">${T('fare')}</th></tr>${f.tickets.map(t=>`<tr><td><span class="swatch" style="--c:${COL[t.mode]}"></span>${NAME[t.mode]}: ${T('pre',{a:esc(t.frm),b:esc(t.to)})}<span class="src">${esc(t.src)}</span></td><td class="r">₹${t.fare}</td></tr>`).join('')}</table>`;
  if(f.split){
    h+=`<div class="perf" style="margin-top:6px"></div><h4>${T('who')}</h4><p class="why">${T('why',{d:f.split.saving})}</p>
    <table><tr><th>${T('operator')}</th><th class="r">${T('own')}</th><th class="r">${T('gives')}</th><th class="r">${T('receives')}</th></tr>
    ${f.split.shares.map(s=>`<tr><td><span class="swatch" style="--c:${COL[s.op]}"></span>${NAME[s.op]} <span class="src" style="display:inline">${s.km} km</span></td><td class="r">₹${s.own_fare}</td><td class="r">₹${s.discount_borne}</td><td class="r"><b>₹${s.net}</b></td></tr>`).join('')}
    <tr><td>${T('clearing')}</td><td></td><td></td><td class="r">₹${f.split.clearing_fee}</td></tr></table>`}
  return h+'<div style="height:10px"></div></div>'}

function render(sel,fresh){if(sel!==curSel)SHOWB=false;curSel=sel;
  const out=$('out');
  if(!opts.length){out.innerHTML=`<p class="empty">${T('none')}</p>`;gRoute.selectAll('*').remove();return}
  const fastest=Math.min(...opts.map(o=>o.mins)),price=o=>o.fare.split?o.fare.split.integrated:o.fare.total,cheapest=Math.min(...opts.map(price));
  const descOf=o=>T('desc',{a:fmt(o.dep),b:fmt(o.arr),c:o.transfers===0?T('c0'):o.transfers===1?T('c1'):T('cN',{n:o.transfers}),w:o.walk_min});
  // tabs make it obvious these are alternatives for the same trip
  const tabs=`<div class="alts"><div class="alts-h"><b>${T('ways',{n:opts.length})}</b>
      <span class="pager"><button class="pg" ${sel===0?'disabled':''} onclick="render(${sel-1})" aria-label="previous">‹</button>${T('ofN',{i:sel+1,n:opts.length})}<button class="pg" ${sel===opts.length-1?'disabled':''} onclick="render(${sel+1})" aria-label="next">›</button></span></div>
    <div class="tabs" role="tablist">${opts.map((o,i)=>`<button role="tab" aria-selected="${i===sel}" class="tab${i===sel?' on':''}" onclick="render(${i})">
      <span class="tn">${T('optN',{n:i+1})}${o.mins===fastest?' ⚡':''}${price(o)===cheapest?' ₹':''}</span><span class="tm">${o.mins}<small>${T('min')}</small></span><span class="tp">₹${price(o)}</span>${RUSH&&o.expected&&o.expected.mins&&o.expected.late_min>0?`<span class="te">≈${o.expected.mins} ${T('min')}${o.expected.missed?' ('+T('tabB')+')':''}</span>`:''}${modebar(o)}</button>`).join('')}</div></div>`;
  const o=opts[sel];
  const flags=[o.mins===fastest&&OPTKEY[o.label]!=='o_fast'?T('fastest'):'',price(o)===cheapest?T('cheapest'):''].filter(Boolean).join(T('and'));
  out.innerHTML=tabs+`<div class="opt sel" role="tabpanel">
      <div class="top"><span class="mins">${o.mins}<small>${T('min')}</small></span><span class="name">${T(OPTKEY[o.label]||o.label)}${flags?` <span class="flag">${flags}</span>`:''}<em>${descOf(o)}</em></span><span class="price">₹${price(o)}</span></div>
      ${modebar(o)}${RUSH?delayBox(o):''}${strip(o)}${ticket(o.fare)}</div>`;
  drawRoute(opts[sel],fresh,sel);
}

function drawRoute(o,fresh,sel){
  gRoute.selectAll('*').remove();
  const line=d3.line().x(p=>proj([p[1],p[0]])[0]).y(p=>proj([p[1],p[0]])[1]);
  // the other options: muted underneath, click to switch

  const alts=opts.map((x,i)=>({x,i})).filter(a=>a.i!==sel);
  const ag=gRoute.selectAll('.altg').data(alts).join('g').attr('class','altg').style('cursor','pointer')
    .on('click',(e,a)=>{e.stopPropagation();render(a.i)})
    .on('mouseenter',function(){d3.select(this).selectAll('.altv').attr('opacity',.8)})
    .on('mouseleave',function(){d3.select(this).selectAll('.altv').attr('opacity',.28)});

  ag.each(function(a){const gg=d3.select(this),legs=a.x.legs.filter(L=>L.kind==='ride'||L.m>=30);

    gg.selectAll('.altv').data(legs).join('path').attr('class','altv').attr('d',L=>line(L.path)).attr('fill','none').attr('stroke-linecap','round').attr('stroke-linejoin','round')
      .attr('stroke',L=>L.kind==='walk'?COL.WALK:COL[L.mode]).attr('opacity',.28).attr('stroke-width',L=>(L.kind==='walk'?2:4)/zoomK)
      .attr('stroke-dasharray',L=>L.kind==='walk'?`${1/zoomK} ${5/zoomK}`:null)});
  const rides=o.legs.filter(L=>L.kind==='ride');
  gRoute.selectAll('.casing').data(rides).join('path').attr('class','casing').attr('d',L=>line(L.path)).attr('fill','none').attr('stroke','#fff').attr('stroke-linecap','round').attr('stroke-linejoin','round').attr('stroke-width',9/zoomK);
  const rt=gRoute.selectAll('.rt').data(o.legs).join('path').attr('class','rt').attr('d',L=>line(L.path)).attr('fill','none').attr('stroke-linecap','round').attr('stroke-linejoin','round')
    .attr('stroke',L=>L.kind==='walk'?COL.WALK:COL[L.mode]).attr('stroke-width',L=>(L.kind==='walk'?3:6)/zoomK);
  rt.filter(L=>L.kind==='walk').attr('stroke-dasharray',`${1/zoomK} ${6/zoomK}`);
  if(fresh) rt.filter(L=>L.kind==='ride').each(function(){const n=this.getTotalLength();this.style.setProperty('--len',n);this.classList.add('drawn')});
  // transfer markers: haldi ring = change vehicle on the same mode, kumkum split ring = change mode
  const X=[];
  for(let i=1;i<rides.length;i++){const a=rides[i-1],b=rides[i],p=b.path[0],[x,y]=proj([p[1],p[0]]);X.push({x,y,mode:a.mode!==b.mode,a,b})}
  const m=gRoute.selectAll('.xfer').data(X).join('g').attr('class','xfer').attr('transform',d=>`translate(${d.x},${d.y}) scale(${1/zoomK})`);
  m.append('circle').attr('r',d=>d.mode?15:12).attr('fill','#fff').attr('stroke',d=>d.mode?KUMKUM:HALDI).attr('stroke-width',4);
  m.filter(d=>d.mode).append('path').attr('d',d3.arc()({innerRadius:0,outerRadius:9,startAngle:Math.PI,endAngle:2*Math.PI})).attr('fill',d=>COL[d.a.mode]);
  m.filter(d=>d.mode).append('path').attr('d',d3.arc()({innerRadius:0,outerRadius:9,startAngle:0,endAngle:Math.PI})).attr('fill',d=>COL[d.b.mode]);
  m.filter(d=>!d.mode).append('circle').attr('r',6).attr('fill',d=>COL[d.a.mode]);
  const lab=m.append('g').attr('transform','translate(20,-13)');
  lab.append('rect').attr('rx',6).attr('height',26).attr('fill',d=>d.mode?KUMKUM:HALDI);
  lab.append('text').attr('x',9).attr('y',17).attr('fill','#fff').attr('font-size',13).attr('font-weight',600).attr('font-family','Avenir Next, sans-serif')
    .text(d=>d.mode?T('mapMode',{a:NAME[d.a.mode],b:NAME[d.b.mode],s:d.b.frm}):T('mapVeh',{a:d.a.route,b:d.b.route}))
    .each(function(){d3.select(this.parentNode).select('rect').attr('width',this.getComputedTextLength()+18)});
  // plan B (rush-hour fallback) drawn dashed on top
  const fb=RUSH&&SHOWB&&o.expected&&o.expected.fallback;
  if(fb){const fl=fb.legs.filter(L=>L.kind==='ride'||L.m>=30);
    gRoute.selectAll('.pbc').data(fl).join('path').attr('class','casing pbc').attr('d',L=>line(L.path)).attr('fill','none').attr('stroke',KUMKUM).attr('stroke-width',9/zoomK).attr('stroke-linecap','round').attr('opacity',.9);
    gRoute.selectAll('.pb').data(fl).join('path').attr('class','rt pb').attr('d',L=>line(L.path)).attr('fill','none').attr('stroke','#fff').attr('stroke-width',3/zoomK).attr('stroke-dasharray',`${6/zoomK} ${5/zoomK}`)}
  startCars(sel,fb);

// moving vehicles on one shared clock: each sits where that option's rider would be at time T
let carRAF=null,CL={t:0,t0:0,t1:1,play:true,cars:null,last:0};const ICON={METRO:'🚇',BRTS:'🚌',AMTS:'🚌',WALK:'🚶'};
function legTracks(legs){return legs.map(L=>{const pts=[];L.path.forEach(p=>{const [x,y]=proj([p[1],p[0]]);
    if(pts.length){const q=pts[pts.length-1];pts.push({x,y,c:q.c+Math.hypot(x-q.x,y-q.y)})}else pts.push({x,y,c:0})});
  return {pts,dep:L.dep,arr:L.arr,mode:L.kind==='walk'?'WALK':L.mode}})}
function along(pts,f){const L=pts[pts.length-1].c*f;let i=1;while(i<pts.length-1&&pts[i].c<L)i++;const a=pts[i-1],b=pts[i]||a,k=b.c>a.c?(L-a.c)/(b.c-a.c):0;return {x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k}}
function posAt(tr,T){ // tr: leg tracks with dep/arr times
  if(T<=tr[0].dep)return {...along(tr[0].pts,0),mode:tr[0].mode,state:'wait'};
  for(let i=0;i<tr.length;i++){const L=tr[i];
    if(T<=L.arr){if(T<L.dep)return {...along(L.pts,0),mode:L.mode,state:'wait'};
      return {...along(L.pts,(T-L.dep)/Math.max(L.arr-L.dep,1)),mode:L.mode,state:'move'}}}
  const L=tr[tr.length-1];return {...along(L.pts,1),mode:L.mode,state:'done'}}
function startCars(sel,fb){
  if(carRAF)cancelAnimationFrame(carRAF);gRoute.selectAll('.car').remove();
  const price=x=>x.fare.split?x.fare.split.integrated:x.fare.total;
  const list=opts.map((x,i)=>({tr:legTracks(x.legs),on:i===sel,i,lab:`${T('optN',{n:i+1})}: ₹${price(x)}, ${x.mins} ${T('min')}${RUSH&&x.expected&&x.expected.late_min>0?' (≈'+x.expected.mins+(x.expected.missed?' '+T('tabB'):'')+')':''}, ${hopsTxt(x.transfers)}`}));
  if(fb){const o=opts[sel],k=o.expected.missed.leg;list.push({tr:legTracks(o.legs.slice(0,k).concat(fb.legs)),on:true,i:sel,b:true,lab:`B: ₹${price(fb)}, ${fb.mins} ${T('min')}, ${hopsTxt(fb.transfers)}`})}
  list.forEach(c=>c.tr=c.tr.filter(L=>L.pts.length>1));
  const cars=gRoute.selectAll('.car').data(list.filter(c=>c.tr.length)).join('g').attr('class','car').style('cursor','pointer').attr('opacity',c=>c.on?1:.6)
    .on('click',(e,c)=>{e.stopPropagation();if(!c.on)render(c.i)});
  cars.append('circle').attr('r',c=>c.on?13:10).attr('fill','#fff').attr('stroke',c=>c.b?KUMKUM:c.on?INDIGO:'#8A93A6').attr('stroke-width',2.5);
  cars.append('text').attr('class','ic').attr('text-anchor','middle').attr('dy','.36em').attr('font-size',c=>c.on?14:11);
  const lg=cars.append('g').attr('transform','translate(16,-24)');
  lg.append('rect').attr('rx',6).attr('height',22).attr('fill',c=>c.b?KUMKUM:c.on?INDIGO:'#fff').attr('stroke',c=>c.on?'none':'#C7CDD8');
  lg.append('text').attr('class','lb').attr('x',8).attr('y',15).attr('font-size',12).attr('font-weight',600).attr('font-family','Avenir Next, sans-serif').attr('fill',c=>c.on?'#fff':INDIGO).text(c=>c.lab)
    .each(function(){d3.select(this.parentNode).select('rect').attr('width',this.getComputedTextLength()+16)});
  CL.cars=cars;CL.t0=Math.min(...opts.map(o=>o.dep));CL.t1=Math.max(...list.filter(c=>c.tr.length).map(c=>c.tr[c.tr.length-1].arr))+120;
  const sl=$('pbSlider');sl.min=CL.t0;sl.max=CL.t1;sl.step=15;$('pb').hidden=false;
  CL.t=CL.t0;CL.play=!matchMedia('(prefers-reduced-motion: reduce)').matches;if(!CL.play)CL.t=(CL.t0+CL.t1)/2;
  paintClock();CL.last=performance.now();carRAF=requestAnimationFrame(tick)}
function paintClock(){const T=CL.t;$('pbSlider').value=T;$('pbTime').textContent=fmt(T);$('pbPlay').textContent=CL.play?'❚❚':'▶';$('pbPlay').setAttribute('aria-label',CL.play?'Pause':'Play');
  if(!CL.cars)return;CL.cars.each(function(c){const p=posAt(c.tr,T),g=d3.select(this);
    g.attr('transform',`translate(${p.x},${p.y}) scale(${1/zoomK})`);g.select('.ic').text(p.state==='done'?'✓':ICON[p.mode]||'•')})}
function tick(now){const dt=now-CL.last;CL.last=now;
  if(CL.play){CL.t+=dt/1000*60*(CL.t1-CL.t0)/60/12; // whole journey plays in ~12 s
    if(CL.t>=CL.t1){CL.t=CL.t1;CL.play=false}}
  paintClock();carRAF=requestAnimationFrame(tick)}
$('pbPlay').onclick=e=>{e.stopPropagation();if(!CL.play&&CL.t>=CL.t1)CL.t=CL.t0;CL.play=!CL.play;CL.last=performance.now();paintClock()};
$('pbSlider').oninput=e=>{CL.play=false;CL.t=+e.target.value;paintClock()};

// offline indicator
function net(){const n=$('net');n.className='chip net'+(navigator.onLine?'':' off');n.innerHTML='<i></i>'+T(navigator.onLine?'online':'offline')}
addEventListener('online',net);addEventListener('offline',net);net();

// heatmap
const MODESETS=[['all','METRO,BRTS,AMTS'],['metroOnly','METRO'],['brtsOnly','BRTS'],['amtsOnly','AMTS'],['busOnly','BRTS,AMTS']];
function heat(){
  if(!pts.from){$('cmp').innerHTML=`<p class="empty">${T('needFrom')}</p>`;return}
  heatOn=true;
  const t=$('time').value,dy=$('day').value,metric=$('hmetric').value,modes=$('hmodes').value;
  fetch(`/heat?from=${pts.from}&time=${t}&day=${dy}&modes=${modes}`).then(r=>r.json()).then(h=>{
    gHeat.selectAll('*').remove();
    const v=metric==='time'?d=>d[2]:d=>d[3],max=metric==='time'?120:60;
    const col=d3.scaleSequential(d3.interpolateRgbBasis(['#1F2A5C','#2457C5','#3FA7A0','#E6C24A','#D2452B','#7A1530'])).domain([0,max]).clamp(true);
    gHeat.selectAll('circle').data(h.sort((a,b)=>v(b)-v(a))).join('circle').attr('cx',d=>proj([d[1],d[0]])[0]).attr('cy',d=>proj([d[1],d[0]])[1])
      .attr('r',3.4/Math.sqrt(zoomK)).attr('fill',d=>col(v(d))).attr('opacity',.85).append('title').text(d=>`${d[2]} min, ₹${d[3]}`);
    const L=$('hleg');L.style.display='block';
    const ramp=d3.range(0,1.01,.1).map(x=>col(x*max)).join(',');
    L.innerHTML=`<b>${T(metric==='time'?'minFrom':'fareFrom')}</b><div class="ramp" style="background:linear-gradient(90deg,${ramp})"></div><div class="ramp-l"><span>0</span><span>${metric==='time'?max/2+' '+T('min'):'₹'+max/2}</span><span>${metric==='time'?max+'+ '+T('min'):'₹'+max+'+'}</span></div>`;
  });
  Promise.all(MODESETS.map(([n,m])=>fetch(`/heat?from=${pts.from}&time=${t}&day=${dy}&modes=${m}`).then(r=>r.json()).then(h=>{
    const in45=h.filter(d=>d[2]<=45),fares=in45.map(d=>d[3]).filter(x=>x>0).sort((a,b)=>a-b);
    return [T(n),in45.length,fares.length?'₹'+fares[fares.length>>1]:T('walkOnly')]}))).then(rows=>{
    const mx=Math.max(...rows.map(r=>r[1]),1);
    $('cmp').innerHTML=`<table><tr><th>${T('network')}</th><th class="r">${T('stops45')}</th><th style="width:30%"></th><th class="r">${T('typical')}</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td class="r"><b>${r[1]}</b></td><td><div class="bar" style="width:${Math.max(2,r[1]/mx*100)}%"></div></td><td class="r">${r[2]}</td></tr>`).join('')}</table>`});
}
$('heat').onclick=heat;
$('hmetric').onchange=()=>gHeat.size()&&gHeat.selectAll('*').size()&&heat();
$('hmodes').onchange=()=>gHeat.selectAll('*').size()&&heat();
$('clearheat').onclick=()=>{heatOn=false;gHeat.selectAll('*').remove();$('hleg').style.display='none';$('cmp').innerHTML=''};

// language switching
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=T(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T(e.dataset.ph));
  const alt=$('alt');alt.textContent=T('alt');alt.lang=T('altLang');
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
  document.querySelectorAll('#presets button').forEach(b=>b.textContent=T('pre',{a:b.dataset.a.replace(/ \(.*\)/,''),b:b.dataset.b.replace(/ \(.*\)/,'')}));
  $('hint').textContent=T(clickNext==='from'?'hintFrom':'hintTo');net();
  if(opts.length)render(curSel);
  if(heatOn)heat();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem('lang',LANG)}catch(e){}applyLang()});
applyLang();
</script></body></html>
